name = "Nock"
version = "0.1.0"
# `Main` is a default target so that plain `lake build` also elaborates the
# `#audit_bridge` manifest in Main.lean (the native_decide quarantine).
defaultTargets = ["Nock", "Main"]

[[lean_lib]]
name = "Nock"

[[lean_exe]]
name = "main"
root = "Main"

[[lean_exe]]
name = "export-corpus"
root = "ExportCorpus"
srcDir = "diff"
