name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: build, gates, audit, oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain (pinned by lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      # A scrubbed build. The audit manifests are elaborated, not replayed:
      # Nock/Audit.lean (via the `Nock` target) throws on axiom-footprint
      # drift, on `sorry`, and on any rename of a name the companion manuscript
      # cites; Main.lean (via the `Main` target) audits the native_decide
      # bridge. Lake re-elaborates both on any upstream change even from a
      # warm cache; the scrub is belt-and-braces.
      - name: Scrubbed build (runs both audit manifests)
        run: |
          rm -rf .lake/build
          lake build

      # The manifests guard names and axiom footprints, not theorem
      # statements. This step catches what they cannot: a `sorry` in a
      # declaration nothing cited depends on, deprecated API, unused variables.
      - name: Fail on any warning
        run: |
          set -o pipefail
          rm -rf .lake/build
          lake build 2>&1 | tee build.log
          if grep -qi 'warning' build.log; then
            echo "::error::build emitted warnings"; grep -i warning build.log; exit 1
          fi
          echo "no warnings"

      - name: Repository discipline gates
        run: ./scripts/gates.sh

      # Builds Main, which audits the quarantined bridge (#audit_bridge) and
      # re-runs the 676-run Class D oracle sweep.
      - name: Oracle verdict preservation
        run: ./scripts/oracle-check.sh

      - name: Axiom footprints (informational)
        run: ./scripts/print-axioms.sh
